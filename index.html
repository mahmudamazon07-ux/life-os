<title>Life OS</title>

<style>
/* Layout: bitta telefon ustuni; yuqorida kun "smenasi", o'rtada ekran, pastda sinov paneli */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #161a2b;
  --muted: #5d6479;
  --line: #d5d9e4;
  --lamp: #c7780a;        /* tungi do'kon chirog'i — yagona urg'u */
  --lamp-soft: #fbefd9;
  --ok: #1f7a4d;
  --ok-soft: #dff1e7;
  --lock: #8a4b0b;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1220; --surface: #181c2e; --ink: #e7e9f2; --muted: #9399b0; --line: #2a3048;
  --lamp: #f0a73a; --lamp-soft: #33270f; --ok: #5fd39a; --ok-soft: #12301f; --lock: #f0b35a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #181c2e; --ink: #e7e9f2; --muted: #9399b0; --line: #2a3048;
  --lamp: #f0a73a; --lamp-soft: #33270f; --ok: #5fd39a; --ok-soft: #12301f; --lock: #f0b35a;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px }
.app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em }
h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.2 }
h2 { font-size: 1.1rem; font-weight: 600 }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600 }

.clock { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap }
.clock .time { font-size: 1.6rem; font-weight: 600 }

/* Mantiqiy kun chizig'i: 16:00 dan 16:00 gacha, Deep Work oynasi belgilangan */
.dayline { position: relative; height: 34px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); overflow: hidden }
.dayline .seg { position: absolute; top: 0; bottom: 0 }
.dayline .shift { background: var(--lamp-soft) }
.dayline .deep { background: var(--lamp); opacity: 0.55 }
.dayline .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink) }
.ticks { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 4px }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); margin-top: 6px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }

.state { padding: 12px 14px; border-radius: 10px; font-weight: 600 }
.state.locked { background: var(--lamp-soft); color: var(--lock) }
.state.open { background: var(--ok-soft); color: var(--ok) }

.streak { display: flex; gap: 24px; align-items: baseline }
.streak .n { font-family: var(--display); font-size: 3rem; font-weight: 800; line-height: 1 }
.chain { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap }
.chain span { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line) }
.chain span.on { background: var(--lamp); border-color: var(--lamp) }

.habits { display: flex; flex-direction: column; gap: 10px }
.habit { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font: inherit; cursor: pointer }
.habit:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px }
.habit .box { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 700; color: var(--surface) }
.habit[aria-pressed="true"] { border-color: var(--ok) }
.habit[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok) }
.habit .name { font-weight: 600 }
.habit .desc { font-size: 0.85rem; color: var(--muted) }
.habit[disabled] { cursor: default }

.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.progress div { height: 100%; background: var(--ok); transition: width .25s }

.actions { display: flex; flex-direction: column; gap: 8px }
.btn { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px;
  font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--lamp); border-color: var(--lamp); color: #1a1205 }
.btn[disabled] { opacity: 0.5; cursor: not-allowed }
.btn small { font-weight: 400; font-size: 0.75rem }

details.test { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface) }
details.test summary { cursor: pointer; font-weight: 600 }
.test .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px }
.test .row button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 0.85rem; cursor: pointer }
.test .row button.danger { color: var(--lock) }
.tablewrap { overflow-x: auto; margin-top: 10px }
table { border-collapse: collapse; font-family: var(--mono); font-size: 0.78rem; width: 100% }
th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap }
th { color: var(--muted); font-weight: 600 }

.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 4.5rem; font-weight: 600; text-align: center; line-height: 1; padding-block: 24px 8px }
.dwbox { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line) }
.dwbox input[type=range] { width: 100%; accent-color: var(--lamp) }
.center { text-align: center }
.pcard.hot { border-color: var(--lamp); background: var(--lamp-soft) }
.pcard .big { font-family: var(--display); font-size: 1.8rem; font-weight: 800; line-height: 1.1 }
.chk { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.9rem }
.chk label { display: flex; gap: 6px; align-items: center; cursor: pointer }
.chk input { width: 18px; height: 18px; accent-color: var(--lamp) }
.task { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer }
.task input { width: 20px; height: 20px; accent-color: var(--ok); flex: none }
.task .t { flex: 1; min-width: 0 }
.task.done .t { text-decoration: line-through; color: var(--muted) }
.qtag { font-family: var(--mono); font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100%; min-height: 90px; resize: vertical }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.pcard { padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0 }
.pcard .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; overflow-wrap: anywhere }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); min-width: 0 }
.form input, .form select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100% }
.form input:focus-visible, .form select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px }
.err { color: var(--lock); font-size: 0.85rem; min-height: 1.2em }
.entry { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
.entry .t { flex: 1; min-width: 0; font-size: 0.85rem }
.entry .a { font-family: var(--mono); font-weight: 600; white-space: nowrap }
.entry button { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; font-size: 0.75rem }
.field { gap: 12px }
.field label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; min-width: 0 }
.field input, .field select { font: inherit; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100% }
.field input:focus-visible, .field select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px }
.field .toggle { flex-direction: row; align-items: center; gap: 10px }
.field .toggle input { width: 20px; height: 20px; accent-color: var(--lamp) }
.tsel { display: flex; align-items: center; gap: 6px }
.tsel select { flex: 1; font-family: var(--mono); font-size: 1.1rem; text-align: center }
:root { --radius: 12px }
.habit, .btn, .dwbox, .pcard, .next, details.test, .state { border-radius: var(--radius) }
.unlock { padding: 16px; border-radius: var(--radius); background: var(--ok-soft); color: var(--ok); font-family: var(--display); font-size: 1.2rem; font-weight: 800; animation: pop .5s ease-out }
@keyframes pop { from { transform: scale(.94); opacity: .5 } to { transform: none; opacity: 1 } }
.rec { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--lamp); color: #1a1205; font-size: .72rem; font-weight: 600; animation: pop .5s ease-out }
.ring { position: relative; width: min(260px, 80vw); max-width: 100%; aspect-ratio: 1; margin: 8px auto }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring circle { fill: none; stroke-width: 8 }
.ring .trk { stroke: var(--line) }
.ring .arc { stroke: var(--lamp); stroke-linecap: round; stroke-dasharray: 691.15; transition: stroke-dashoffset 1s linear }
.ring .timer { position: absolute; inset: 0; display: grid; place-items: center; padding: 0; font-size: 3rem }
@media (prefers-reduced-motion: reduce) { .unlock, .rec { animation: none } .ring .arc { transition: none } }
.tl { display: flex; flex-direction: column; gap: 6px }
.tl-track { position: relative; touch-action: none; cursor: ew-resize; height: 56px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-top: 18px }
.blk { position: absolute; top: 6px; bottom: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; pointer-events: none; min-width: 18px; user-select: none; -webkit-user-select: none }
.blk-work { background: var(--lamp-soft); border: 1px solid var(--lamp) }
.blk-deep { background: var(--lamp); color: #1a1205; z-index: 2 }
.blk .bl { font-size: .72rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline: 12px; pointer-events: none }
.blk .h { position: absolute; top: 0; bottom: 0; width: 14px; cursor: ew-resize }
.blk .h::after { content: ""; position: absolute; top: 30%; bottom: 30%; left: 6px; width: 2px; border-radius: 1px; background: currentColor; opacity: .45 }
.blk-work .h::after { background: var(--lamp) }
.blk .h.l { left: 0 } .blk .h.r { right: 0 }
.blk.drag { cursor: grabbing; box-shadow: 0 4px 14px rgb(0 0 0 / .18); outline: 2px solid var(--ink); outline-offset: 1px }
.tl-track .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); z-index: 3; pointer-events: none }
.tl-track .now span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: .68rem; background: var(--ink); color: var(--bg); padding: 1px 5px; border-radius: 4px; margin-bottom: 2px }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.sw.work { background: var(--lamp-soft); border: 1px solid var(--lamp) } .sw.deep { background: var(--lamp) }
.tl-track .now.scrub { width: 3px; background: var(--lamp) }
.tl-track .now.scrub span { background: var(--lamp); color: #1a1205; font-weight: 600 }
.tl-status { font-size: .85rem; font-weight: 600; color: var(--lock) }
.dayline .past { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ink); opacity: .06; transition: width 1s linear; pointer-events: none }
.dayline .now { transition: left 1s linear; z-index: 2 }
.dayline .pulse { position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--lamp); animation: pulse 2s ease-out infinite }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--lamp) } 70% { box-shadow: 0 0 0 8px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
.dayline .seg.active { animation: glow 2.4s ease-in-out infinite }
@keyframes glow { 50% { filter: brightness(1.12) saturate(1.3) } }
.dayline.intro .seg { transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1) both }
.dayline.intro .seg.deep { animation-delay: .15s }
@keyframes grow { from { transform: scaleX(0) } }
.dayline { overflow: visible }
@media (prefers-reduced-motion: reduce) { .dayline .pulse, .dayline .seg.active, .dayline.intro .seg { animation: none } .dayline .now, .dayline .past { transition: none } }
.streakline { font-family: var(--display); font-size: 1.3rem; font-weight: 800 }
.habit .cue { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--lamp); font-weight: 600 }
.dayline .seg.sleep { background: repeating-linear-gradient(135deg, var(--line) 0 4px, transparent 4px 8px) }
.legend .slp { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px) }
.idea, .coach { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line) }
.coach { border-color: var(--ok); gap: 6px }
.coach .nav { margin-top: 6px }
.laws { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; font-size: .9rem }
.chips.days label { flex-direction: row; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-weight: 400; font-size: .85rem; cursor: pointer }
.chips.days input { width: 16px; height: 16px; accent-color: var(--lamp) }
.chain span.rest { border-style: dashed; background: none }
.hint { margin: 0; font-size: 0.82rem; color: var(--muted) }
.list { display: flex; flex-direction: column; gap: 8px }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { font: inherit; font-size: 0.85rem; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer }
.dots { display: flex; gap: 6px }
.dots span { flex: 1; height: 4px; border-radius: 2px; background: var(--line) }
.dots span.on { background: var(--lamp) }
.nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg) }
.next { display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 14px; background: var(--lamp-soft); border: 1px solid var(--lamp) }
.next .big { font-family: var(--display); font-size: 1.35rem; font-weight: 800; line-height: 1.2 }
.next .btn { margin-top: 6px }
.goals { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-left: 3px solid var(--lamp); background: var(--surface) }
@media (prefers-reduced-motion: reduce) { .progress div { transition: none } }

/* === Daftar dizayni === */
:root{--bg:#f2f0eb;--surface:#f7f5f0;--ink:#1d1d1b;--muted:#55524c;--line:#d3cfc6;--lamp:#d4f25a;--lamp-soft:#eef7c4;--ok:#2448c8;--ok-soft:#e5eafa;--lock:#a3402f;color-scheme:light;--pen:#2448c8;--hand:"Kalam","Segoe Print",cursive}

:root[data-theme="dark"]{--bg:#f2f0eb;--surface:#f7f5f0;--ink:#1d1d1b;--muted:#55524c;--line:#d3cfc6;--lamp:#d4f25a;--lamp-soft:#eef7c4;--ok:#2448c8;--ok-soft:#e5eafa;--lock:#a3402f;color-scheme:light}
body::before{content:"";position:fixed;left:10px;top:0;bottom:0;width:1.5px;background:#e2a69c;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;padding-bottom:72px}
.eyebrow{text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:500}
.btn{background:var(--surface);border-color:var(--line)}

<script>
/* ===== Sozlamalar: hammasini foydalanuvchi tanlaydi ===== */
const KEY = "lifeos.v2";
const WEEKDAYS = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const SUGGEST = [["Kitob o'qish", "1 bet"], ["Sport", "5 daqiqa"], ["Til o'rganish", "3 so'z"], ["Meditatsiya", "2 daqiqa"], ["Kundalik yozish", "1 jumla"]];
// Bo'sh maydonlardagi xira namunalar
const EXH = [["Kitob o'qish", "1 bet"], ["Sport", "5 daqiqa"], ["Til o'rganish", "3 so'z"]];
const DEFAULTS = {

/* ===== Vaqt (logic/time_utils.py) ===== */
const hm = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
function nowLocal() { return new Date(Date.now() + state.offsetMin * 60000 - new Date().getTimezoneOffset() * 60000); }
const iso = d => d.toISOString().slice(0, 10);
// Mantiqiy kun: vaqtdan "kun boshlanish soati"ni ayirib, sanasini olamiz
const logicalDate = (local = nowLocal()) => iso(new Date(local.getTime() - hm(S().dayStart) * 60000));
function addDays(s, n) { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
const wdOf = d => new Date(d + "T00:00:00Z").getUTCDay();
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const short = d => `${Number(d.slice(8))}-${MONTHS[Number(d.slice(5, 7)) - 1]}`;
const human = d => `${short(d)}, ${WEEKDAYS[wdOf(d)].toLowerCase()}`;
const fmtMin = n => n >= 60 ? `${Math.floor(n / 60)} soat ${n % 60} daq` : `${n} daq`;

/* ===== Odatlar (logic/habits.py) =====
   Har odatda since/until bor: o'zgarish ERTADAN kuchga kiradi.
   Aks holda odatni o'chirib qulfni "ochish" yoki yangisini qo'shib o'tgan zanjirni buzish mumkin bo'lardi. */
// Dam olish kuni: odatlar majburiy emas, zanjir uzilmaydi (bu kun hisobga olinmaydi)
function isRest(d) {
  const r = S() && S().rest; if (!r || r.mode === "none") return false;
  if (r.mode === "week") return (r.days || []).includes(wdOf(d));
  if (r.mode === "month") return Number(d.slice(8)) === r.monthDay;
  if (r.mode === "every") { const diff = Math.round((Date.parse(d) - Date.parse(r.anchor || d)) / 864e5); return diff > 0 && diff % r.every === 0; }
  return false;
}
const prevWork = d => { let p = addDays(d, -1); for (let i = 0; i < 30 && isRest(p); i++) p = addDays(p, -1); return p; };
const requiredOn = d => isRest(d) ? [] : S().habits.filter(h => (!h.since || h.since <= d) && (!h.until || d <= h.until));
const isDone = (id, d) => state.logs.some(l => l.habit_id === id && l.logical_date === d);
const todayHabits = d => requiredOn(d).map(h => ({ ...h, done: isDone(h.id, d) }));
const isUnlocked = d => { if (isRest(d)) return true; const h = todayHabits(d); return h.length > 0 && h.every(x => x.done); };
function markDone(id, d) { if (!isDone(id, d)) state.logs.push({ habit_id: id, logical_date: d }); save(); }
function unmark(id, d) { state.logs = state.logs.filter(l => !(l.habit_id === id && l.logical_date === d)); save(); }
function fullDays() {
  const days = new Set(state.logs.map(l => l.logical_date));
  return new Set([...days].filter(d => { const r = requiredOn(d); return r.length && r.every(h => isDone(h.id, d)); }));
}
// "Ikki marta qoldirma": bitta qoldirilgan kun zanjirni uzmaydi, ketma-ket ikkitasi uzadi
function streakFrom(f, c) { let n = 0, gap = false; for (let g = 0; g < 4000; g++) { if (isRest(c)) { c = addDays(c, -1); continue; } if (f.has(c)) { n++; gap = false; } else if (!gap && f.has(prevWork(c))) gap = true; else break; c = addDays(c, -1); } return n; }
function currentStreak(d) { const f = fullDays(); return streakFrom(f, f.has(d) ? d : addDays(d, -1)); }
const missedYesterday = d => { const f = fullDays(); return f.size > 0 && !f.has(prevWork(d)) && currentStreak(d) > 0; };
function bestStreak() { const f = fullDays(); let best = 0; f.forEach(d => { best = Math.max(best, streakFrom(f, d)); }); return best; }

/* ===== Deep Work (logic/deepwork.py) ===== */
const virtNow = () => Date.now() + state.offsetMin * 60000;

function startSession(planned) { if (runningSession()) return; state.sessions.push({ id: Date.now(), logical_date: logicalDate(), topic: S().deep.topic, planned, startedAt: virtNow(), status: "running", actual: null }); save(); }
function finishSession(s, completed) { if (s.status !== "running") return; s.actual = Math.min(Math.floor((virtNow() - s.startedAt) / 60000), s.planned); s.status = completed ? "completed" : "aborted"; save(); }

function dayline(local) {

  return "";
}

  if (d.rest && d.rest.mode === "week" && !d.rest.days.length) return "Dam olish uchun kamida bitta kunni tanlang.";
  if (d.rest && d.rest.mode === "week" && d.rest.days.length > 3) return "Haftada 3 kundan ko'p dam olish kuni tanlab bo'lmaydi.";

function applyDraft(d, first) {
  const today = state.settings ? logicalDate() : null, tomorrow = today && addDays(today, 1);
  const old = state.settings ? state.settings.habits : [];
  let nextId = Math.max(0, ...old.map(h => h.id), ...state.logs.map(l => l.habit_id)) + 1;
  const kept = d.habits.filter(h => h.name);
  const habits = old.map(h => {
    const m = kept.find(k => k.id === h.id);
    if (m) return { ...h, name: m.name, desc: m.desc };
    return h.until ? h : { ...h, until: today };            // o'chirildi: bugun hali kerak, ertadan emas
  });
  kept.filter(k => !k.id).forEach(k => habits.push({ id: nextId++, name: k.name, desc: k.desc, since: first ? "" : tomorrow }));
  const oR = state.settings && state.settings.rest;   // "har N kunda": hisob saqlangan kundan boshlanadi
  if (d.rest && d.rest.mode === "every" && (!oR || oR.mode !== "every" || oR.every !== d.rest.every || !d.rest.anchor)) d.rest = { ...d.rest, anchor: today || "" };
  state.settings = { ...d, habits };
  save();
}

  if (w.on && inR(hm(w.start), hm(w.end))) return card("Hozir", "Ish vaqti", doneDw ? taskSub : `${topic}: ${dp.start} da`);
  if (doneDw) return card("Bugun", `${topic} bajarildi`, taskSub || "Bugungi asosiy ish qilindi", open ? `<button class="btn" data-act="tk">Vazifalar</button>` : "");
  return card("Keyingi qadam", `${dp.start} da ${topic}`, taskSub, `<button class="btn primary" data-act="dw">Hozir boshlash</button>`);
}

$app.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"), act = a && a.dataset.act;
  const sug = e.target.closest("[data-sug]");
  // --- sozlash ---
  if (sug || act === "hadd") {
    collect();
    const empty = draft.habits.findIndex(h => !h.name);
    const [n, d] = sug ? sug.dataset.sug.split("|") : ["", ""];
    if (sug && empty >= 0) draft.habits[empty] = { ...draft.habits[empty], name: n, desc: d };
    else if (draft.habits.length < 3) draft.habits.push({ name: n, desc: d });
    return render();
  }
  if (act === "obnext") {
    collect(); setMsg = "";
    if (STEPS[obStep][2] === "obwho" && !draft.goals[0]) { setMsg = "Bittasini tanlang yoki o'zingiz yozing."; return render(); }
    if (STEPS[obStep][2] === "obdeep" && deepErr(draft)) { setMsg = deepErr(draft); return render(); }
    if (obStep < STEPS.length - 1) { obStep++; return render(); }
    const err = validate(draft); if (err) { setMsg = err; return render(); }
    applyDraft(draft, true); draft = null; view = "home"; return render();
  }
  if (act === "obback") { collect(); obStep--; setMsg = ""; return render(); }
  if (act === "set") { draft = { ...structuredClone(S()), habits: activeDraftHabits() }; setMsg = ""; view = "set"; return render(); }
  if (act === "setsave") {
    collect(); const err = validate(draft); if (err) { setMsg = err; return render(); }
    applyDraft(draft, false); draft = null; view = "home"; return render();
  }
  if (!S()) return;
  const day = logicalDate();
  const co = e.target.closest("[data-coach]");
  if (co) { (state.coachSeen ||= {})[co.dataset.coach] = day; save(); return render(); }
  // --- odatlar ---
  const h = e.target.closest(".habit");
  if (h && !h.disabled) { const id = Number(h.dataset.id), was = isUnlocked(day); if (isDone(id, day)) unmark(id, day); else { markDone(id, day); freshId = id; try { navigator.vibrate && navigator.vibrate(12); } catch (x) {} } if (!was && isUnlocked(day)) justUnlocked = true; return render(); }
  const sh = e.target.closest("[data-shift]");
  if (sh) { state.offsetMin = sh.dataset.shift === "reset" ? 0 : state.offsetMin + Number(sh.dataset.shift); return render(); }
  if (act === "home") { view = "home"; draft = null; return render(); }
  if (act === "dw" || act === "tk") { view = act; return render(); }
  if (act === "rv") { view = "rv"; rvSaved = false; return render(); }
  if (act === "dwstart") { startSession(Number(document.getElementById("dwmin").value)); return render(); }
  if (act === "dwstop") { const r = runningSession(); if (r) finishSession(r, false); view = "dw"; return render(); }
  if (act === "tkadd") {
    const title = document.getElementById("tktitle").value.trim();
    if (!title) { tkError = "Vazifa nomi bo'sh bo'lmasin"; return render(); }
    state.tasks.push({ id: Date.now(), title, imp: document.getElementById("tkimp").checked, urg: document.getElementById("tkurg").checked, logical_date: day, done: false });
    tkError = ""; save(); return render();
  }
  if (act === "rvsave") { state.reviews[weekRange(day)[0]] = document.getElementById("rvnote").value.trim(); rvSaved = true; save(); return render(); }
  if (act === "fill") { for (let i = 1; i <= 3; i++) requiredOn(addDays(day, -i)).forEach(x => markDone(x.id, addDays(day, -i))); return render(); }
  if (act === "wipe") {
    if (!wipeArmed) { wipeArmed = true; a.textContent = "Tasdiqlash uchun yana bosing"; setTimeout(() => { wipeArmed = false; render(); }, 3000); return; }
    wipeArmed = false; state = { logs: [], offsetMin: 0, sessions: [], tasks: [], reviews: {}, settings: null }; obStep = 0; draft = null; save(); return render();
  }
});
$app.addEventListener("change", e => {
  if (e.target.id === "f-rmode") { collect(); return render(); }
  if (!e.target.dataset.task) return;
  const t = state.tasks.find(x => x.id === Number(e.target.dataset.task));
  if (t) { t.done = e.target.checked; save(); render(); }
});
$app.addEventListener("input", e => { if (e.target.id === "dwmin") document.getElementById("dwlabel").textContent = e.target.value; });
$app.addEventListener("toggle", e => { if (e.target.id === "testpanel") sessionOpen = e.target.open; }, true);

// Buzilgan eski qiymatni avtomatik tuzatish: tugash = boshlanish + sessiya davomiyligi
if (S() && deepErr(S())) { S().deep.end = hmStr(hm(S().deep.start) + (S().deep.minutes || 90)); save(); }
render();
let ticks = 0;
setInterval(() => {
  ticks++;
  if (wipeArmed || !S() || view === "set" || drag) return;
  if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (runningSession() || ticks % 30 === 0) render();
}, 1000);
</script>
